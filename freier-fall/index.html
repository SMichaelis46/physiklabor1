<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>S.MICHAELIS – Freier Fall</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0a0f1d;
color:#eef2ff;
font-family:Arial,Helvetica,sans-serif;
overflow:hidden
}

header{
height:68px;
background:#11182b;
border-bottom:1px solid #293552;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 24px
}

.logo{
font-size:28px;
font-weight:800;
letter-spacing:3px
}

.title{
font-size:18px;
color:#aab5cc
}

main{
height:calc(100vh - 68px);
padding:16px;
display:grid;
grid-template-columns:1fr 1fr;
gap:16px
}

.panel{
background:#11182b;
border:1px solid #293552;
border-radius:15px;
padding:15px;
overflow:hidden;
min-width:0
}

.panelTitle{
font-size:19px;
font-weight:bold;
margin-bottom:12px
}

.controls{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:10px
}

.control{
background:#171f35;
border-radius:10px;
padding:10px
}

.control label{
display:flex;
justify-content:space-between;
font-size:13px;
color:#c3cce0;
margin-bottom:7px
}

.val{
color:#ffd84d;
font-weight:bold
}

input[type=range]{
width:100%;
accent-color:#ffd84d
}

.buttons{
display:flex;
gap:9px;
margin-bottom:10px
}

button{
border:0;
border-radius:9px;
padding:10px 17px;
font-weight:bold;
font-size:14px;
cursor:pointer
}

.start{
background:#ffd84d;
color:#111
}

.pause{
background:#59657f;
color:white
}

.reset{
background:#d9deea;
color:#111
}

button:hover{
filter:brightness(1.1)
}

.values{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-bottom:10px
}

.valueCard{
background:#171f35;
border-radius:9px;
padding:8px;
text-align:center
}

.valueCard small{
display:block;
font-size:11px;
color:#8e9ab5
}

.valueCard strong{
font-size:18px
}

#scene{
display:block;
width:100%;
height:calc(100% - 190px);
min-height:430px;
background:#080d18;
border-radius:11px
}

.graphs{
height:calc(100% - 35px);
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.graph{
position:relative;
background:#080d18;
border-radius:10px;
padding:7px;
min-height:0
}

.graphTitle{
font-size:13px;
font-weight:bold;
color:#cbd3e4;
padding:2px 5px 5px
}

canvas.chart{
width:100%;
height:calc(100% - 25px);
display:block
}

.tooltip{
position:absolute;
display:none;
background:#f4f6fb;
color:#111;
padding:7px 9px;
border-radius:7px;
font-size:12px;
line-height:1.4;
pointer-events:none;
z-index:10;
box-shadow:0 4px 15px rgba(0,0,0,.45);
white-space:nowrap
}

@media(max-width:1050px){

body{
overflow:auto
}

main{
height:auto;
grid-template-columns:1fr
}

.panel{
height:700px
}

#scene{
height:520px
}

.graphs{
height:640px
}
}

@media(max-width:650px){

.controls{
grid-template-columns:1fr
}

.values{
grid-template-columns:1fr 1fr
}

.graphs{
grid-template-columns:1fr
}

.panel{
height:auto
}
}
</style>
</head>

<body>

<header>
<div class="logo">S.MICHAELIS</div>
<div class="title">Physik · Freier Fall</div>
</header>

<main>

<!-- ================= LINKER BEREICH ================= -->

<section class="panel">

<div class="panelTitle">
Freier Fall – Simulation
</div>

<div class="controls">

<div class="control">
<label>
<span>Anfangshöhe h₀</span>
<span class="val" id="h0Val">20,0 m</span>
</label>
<input id="h0" type="range" min="5" max="50" step="0.5" value="20">
</div>

<div class="control">
<label>
<span>Erdbeschleunigung g</span>
<span class="val" id="gVal">9,81 m/s²</span>
</label>
<input id="g" type="range" min="1" max="20" step="0.01" value="9.81">
</div>

</div>

<div class="buttons">
<button class="start" id="start">▶ START</button>
<button class="pause" id="pause">Ⅱ PAUSE</button>
<button class="reset" id="reset">↻ RESET</button>
</div>

<div class="values">

<div class="valueCard">
<small>t</small>
<strong id="tValue">0,00 s</strong>
</div>

<div class="valueCard">
<small>h</small>
<strong id="hValue">20,00 m</strong>
</div>

<div class="valueCard">
<small>v</small>
<strong id="vValue">0,00 m/s</strong>
</div>

<div class="valueCard">
<small>a</small>
<strong id="aValue">9,81 m/s²</strong>
</div>

</div>

<canvas id="scene"></canvas>

</section>


<!-- ================= RECHTER BEREICH ================= -->

<section class="panel">

<div class="panelTitle">
Diagramme – entstehen während des Falls
</div>

<div class="graphs">

<div class="graph">
<div class="graphTitle">h-t-Diagramm</div>
<canvas class="chart" id="chartH"></canvas>
<div class="tooltip" id="tipH"></div>
</div>

<div class="graph">
<div class="graphTitle">v-t-Diagramm</div>
<canvas class="chart" id="chartV"></canvas>
<div class="tooltip" id="tipV"></div>
</div>

<div class="graph">
<div class="graphTitle">a-t-Diagramm</div>
<canvas class="chart" id="chartA"></canvas>
<div class="tooltip" id="tipA"></div>
</div>

<div class="graph">
<div class="graphTitle">Bewegungsdaten</div>
<canvas class="chart" id="chartInfo"></canvas>
</div>

</div>

</section>

</main>

<script>

const $=id=>document.getElementById(id);

const h0Slider=$("h0");
const gSlider=$("g");

const h0Val=$("h0Val");
const gVal=$("gVal");

const tValue=$("tValue");
const hValue=$("hValue");
const vValue=$("vValue");
const aValue=$("aValue");

const scene=$("scene");
const ctx=scene.getContext("2d");

let h0=20;
let g=9.81;
let t=0;

let running=false;
let lastTime=null;
let history=[];


/* ================= FORMAT ================= */

function fmt(n,d=2){
return Number(n).toFixed(d).replace(".",",")
}


/* ================= PARAMETER ================= */

function parameters(){

h0=parseFloat(h0Slider.value);
g=parseFloat(gSlider.value);

h0Val.textContent=fmt(h0,1)+" m";
gVal.textContent=fmt(g,2)+" m/s²";
}


/* ================= PHYSIK ================= */

function fallTime(){

return Math.sqrt(2*h0/g);

}

function getData(time){

const h=Math.max(0,h0-0.5*g*time*time);

const v=Math.sqrt(Math.max(0,2*g*(h0-h)));

return{
h:h,
v:v,
a:g
};

}


/* ================= WERTE ================= */

function updateValues(){

const d=getData(t);

tValue.textContent=fmt(t)+" s";
hValue.textContent=fmt(d.h)+" m";
vValue.textContent=fmt(d.v)+" m/s";
aValue.textContent=fmt(d.a)+" m/s²";

}


/* ================= HISTORY ================= */

function createHistory(){

history=[];

if(t<=0)return;

const steps=220;

for(let i=0;i<=steps;i++){

const tt=t*i/steps;
const d=getData(tt);

history.push({
t:tt,
h:d.h,
v:d.v,
a:d.a
});

}

}


/* ================= RESIZE ================= */

function resizeCanvas(canvas,context){

const r=canvas.getBoundingClientRect();
const dpr=window.devicePixelRatio||1;

canvas.width=r.width*dpr;
canvas.height=r.height*dpr;

context.setTransform(dpr,0,0,dpr,0,0);

}

function resizeAll(){

resizeCanvas(scene,ctx);

charts.forEach(c=>{
resizeCanvas(c.canvas,c.canvas.getContext("2d"));
});

drawScene();
drawCharts();

}

window.addEventListener("resize",resizeAll);


/* ================= SZENE ================= */

function drawScene(){

const w=scene.clientWidth;
const h=scene.clientHeight;

ctx.clearRect(0,0,w,h);

ctx.fillStyle="#080d18";
ctx.fillRect(0,0,w,h);

const ground=h-45;
const top=45;

const shaftX=w/2;

const scale=(ground-top-20)/h0;

const d=getData(t);

const ballY=ground-d.h*scale;


/* Gitter */

ctx.strokeStyle="#17233b";
ctx.lineWidth=1;

for(let y=top;y<=ground;y+=40){

ctx.beginPath();
ctx.moveTo(30,y);
ctx.lineTo(w-30,y);
ctx.stroke();

}


/* Höhen-Skala */

ctx.fillStyle="#77849e";
ctx.font="11px Arial";

const intervals=5;

for(let i=0;i<=intervals;i++){

const hv=h0-i*h0/intervals;
const yy=top+(ground-top)*i/intervals;

ctx.fillText(
fmt(hv,1)+" m",
10,
yy+4
);

}


/* Fallstrecke */

ctx.strokeStyle="#66728b";
ctx.lineWidth=3;

ctx.beginPath();
ctx.moveTo(shaftX,top);
ctx.lineTo(shaftX,ground);
ctx.stroke();


/* Boden */

ctx.fillStyle="#3a4660";
ctx.fillRect(0,ground,w,12);


/* Höhenlinie */

ctx.strokeStyle="#ffd84d";
ctx.lineWidth=2;
ctx.setLineDash([6,5]);

ctx.beginPath();
ctx.moveTo(shaftX-80,ballY);
ctx.lineTo(shaftX+80,ballY);
ctx.stroke();

ctx.setLineDash([]);


/* Höhenpfeil */

ctx.strokeStyle="#65d6ff";
ctx.lineWidth=3;

ctx.beginPath();
ctx.moveTo(shaftX-105,ground);
ctx.lineTo(shaftX-105,ballY);
ctx.stroke();


ctx.fillStyle="#65d6ff";

ctx.beginPath();
ctx.moveTo(shaftX-105,ballY);
ctx.lineTo(shaftX-111,ballY+11);
ctx.lineTo(shaftX-99,ballY+11);
ctx.closePath();
ctx.fill();


ctx.beginPath();
ctx.moveTo(shaftX-105,ground);
ctx.lineTo(shaftX-111,ground-11);
ctx.lineTo(shaftX-99,ground-11);
ctx.closePath();
ctx.fill();


ctx.save();
ctx.translate(shaftX-118,(ballY+ground)/2);
ctx.rotate(-Math.PI/2);

ctx.font="bold 14px Arial";
ctx.fillStyle="#65d6ff";
ctx.textAlign="center";
ctx.fillText("Fallhöhe h",0,0);

ctx.restore();


/* Stein */

ctx.fillStyle="#ffd84d";
ctx.strokeStyle="#fff";
ctx.lineWidth=2;

ctx.beginPath();
ctx.arc(shaftX,ballY,15,0,Math.PI*2);
ctx.fill();
ctx.stroke();


/* Geschwindigkeitsvektor */

const vectorLength=Math.min(130,d.v*5);

ctx.strokeStyle="#ff6262";
ctx.lineWidth=4;

ctx.beginPath();
ctx.moveTo(shaftX,ballY+17);
ctx.lineTo(shaftX,ballY+17+vectorLength);
ctx.stroke();


ctx.fillStyle="#ff6262";

ctx.beginPath();
ctx.moveTo(
shaftX,
ballY+17+vectorLength
);

ctx.lineTo(
shaftX-8,
ballY+vectorLength+4
);

ctx.lineTo(
shaftX+8,
ballY+vectorLength+4
);

ctx.closePath();
ctx.fill();


/* Info */

ctx.font="bold 15px Arial";
ctx.fillStyle="#ffd84d";

ctx.fillText(
"h₀ = "+fmt(h0,1)+" m",
20,
24
);

ctx.fillStyle="#aab5cc";

ctx.fillText(
"g = "+fmt(g,2)+" m/s²",
140,
24
);

ctx.fillStyle="#65d6ff";

ctx.fillText(
"h = "+fmt(d.h)+" m",
260,
24
);

ctx.fillStyle="#ff6262";

ctx.fillText(
"v = "+fmt(d.v)+" m/s",
360,
24
);


/* Aufprall */

if(t>=fallTime()-0.0001){

ctx.fillStyle="#ffd84d";
ctx.font="bold 18px Arial";
ctx.textAlign="center";

ctx.fillText(
"Aufprall auf dem Boden",
shaftX,
ground-20
);

ctx.textAlign="left";

}

}


/* ================= GRAPH OBJEKTE ================= */

const charts=[

{
canvas:$("chartH"),
tip:$("tipH"),
type:"h",
label:"h / m"
},

{
canvas:$("chartV"),
tip:$("tipV"),
type:"v",
label:"v / m/s"
},

{
canvas:$("chartA"),
tip:$("tipA"),
type:"a",
label:"a / m/s²"
}

];


/* ================= GRAPHEN ================= */

function getGraphInfo(type){

const T=fallTime();

let min=0;
let max=1;

if(type==="h"){

min=0;
max=h0;

}

if(type==="v"){

min=0;
max=Math.sqrt(2*g*h0);

}

if(type==="a"){

min=0;
max=g*1.15;

}

return{min,max,T};

}


function drawChart(c){

const canvas=c.canvas;
const context=canvas.getContext("2d");

const w=canvas.clientWidth;
const h=canvas.clientHeight;

context.clearRect(0,0,w,h);

context.fillStyle="#080d18";
context.fillRect(0,0,w,h);

const left=48;
const right=12;
const top=14;
const bottom=34;

const pw=w-left-right;
const ph=h-top-bottom;

const info=getGraphInfo(c.type);

const min=info.min;
const max=info.max;


/* Gitter */

context.strokeStyle="#1a2740";
context.lineWidth=1;

for(let i=0;i<=5;i++){

const x=left+pw*i/5;

context.beginPath();
context.moveTo(x,top);
context.lineTo(x,h-bottom);
context.stroke();

}

for(let i=0;i<=4;i++){

const y=top+ph*i/4;

context.beginPath();
context.moveTo(left,y);
context.lineTo(w-right,y);
context.stroke();

}


/* Achsen */

context.strokeStyle="#8793aa";
context.lineWidth=1.5;

context.beginPath();
context.moveTo(left,top);
context.lineTo(left,h-bottom);
context.lineTo(w-right,h-bottom);
context.stroke();


/* Beschriftung X */

context.fillStyle="#9da9bf";
context.font="10px Arial";
context.textAlign="center";

for(let i=0;i<=5;i++){

const x=left+pw*i/5;
const tv=info.T*i/5;

context.fillText(
fmt(tv,1),
x,
h-bottom+17
);

}


/* Beschriftung Y */

context.textAlign="right";

for(let i=0;i<=4;i++){

const value=max-(max-min)*i/4;
const y=top+ph*i/4;

context.fillText(
fmt(value,1),
left-6,
y+3
);

}


/* Einheit */

context.textAlign="center";

context.fillText(
"t / s",
left+pw/2,
h-5
);


/* Kurve */

if(history.length>=2){

context.beginPath();

history.forEach((p,i)=>{

const x=left+(p.t/info.T)*pw;

const value=p[c.type];

const y=
top+(max-value)/(max-min)*ph;

if(i===0){
context.moveTo(x,y);
}else{
context.lineTo(x,y);
}

});

if(c.type==="h"){
context.strokeStyle="#ffd84d";
}

if(c.type==="v"){
context.strokeStyle="#65d6ff";
}

if(c.type==="a"){
context.strokeStyle="#ff6262";
}

context.lineWidth=3.5;
context.stroke();

}


/* Zeit-Cursor */

const cursorX=
left+(t/info.T)*pw;

context.strokeStyle="#ffffff";
context.lineWidth=1.5;
context.setLineDash([5,4]);

context.beginPath();
context.moveTo(cursorX,top);
context.lineTo(cursorX,h-bottom);
context.stroke();

context.setLineDash([]);


/* Punkt */

const current=getData(t);

const currentValue=current[c.type];

const currentY=
top+(max-currentValue)/(max-min)*ph;

context.fillStyle="#fff";

context.beginPath();
context.arc(cursorX,currentY,4.5,0,Math.PI*2);
context.fill();

}


/* ================= INFO-CANVAS ================= */

function drawInfo(){

const canvas=$("chartInfo");
const context=canvas.getContext("2d");

const w=canvas.clientWidth;
const h=canvas.clientHeight;

context.clearRect(0,0,w,h);

context.fillStyle="#080d18";
context.fillRect(0,0,w,h);

const d=getData(t);
const T=fallTime();

context.fillStyle="#ffd84d";
context.font="bold 15px Arial";

context.fillText(
"Freier Fall",
20,
35
);

context.font="14px Arial";
context.fillStyle="#c5cee0";

const lines=[

["Anfangshöhe h₀",fmt(h0)+" m"],
["Zeit t",fmt(t)+" s"],
["Höhe h",fmt(d.h)+" m"],
["Geschwindigkeit v",fmt(d.v)+" m/s"],
["Beschleunigung a",fmt(d.a)+" m/s²"],
["Fallzeit",fmt(T)+" s"]

];

lines.forEach((line,i)=>{

const y=70+i*38;

context.fillStyle="#8793aa";
context.fillText(line[0],20,y);

context.fillStyle="#eef2ff";
context.font="bold 14px Arial";
context.fillText(line[1],150,y);

context.font="14px Arial";

});

}


function drawCharts(){

charts.forEach(drawChart);
drawInfo();

}


/* ================= MOUSEOVER ================= */

charts.forEach(c=>{

c.canvas.addEventListener("mousemove",event=>{

if(history.length<1){
c.tip.style.display="none";
return;
}

const rect=c.canvas.getBoundingClientRect();

const x=event.clientX-rect.left;

const left=48;
const right=12;

const pw=c.canvas.clientWidth-left-right;

let mouseT=
((x-left)/pw)*fallTime();

mouseT=Math.max(
0,
Math.min(fallTime(),mouseT)
);

let nearest=history[0];

history.forEach(p=>{

if(
Math.abs(p.t-mouseT)<
Math.abs(nearest.t-mouseT)
){
nearest=p;
}

});

let text=
"t = "+fmt(nearest.t)+" s<br>";

if(c.type==="h"){
text+="h = "+fmt(nearest.h)+" m";
}

if(c.type==="v"){
text+="v = "+fmt(nearest.v)+" m/s";
}

if(c.type==="a"){
text+="a = "+fmt(nearest.a)+" m/s²";
}

c.tip.innerHTML=text;
c.tip.style.display="block";

const card=c.canvas.parentElement;

let tx=
event.clientX-
card.getBoundingClientRect().left+
10;

let ty=
event.clientY-
card.getBoundingClientRect().top+
10;

if(tx+120>card.clientWidth){
tx-=130;
}

c.tip.style.left=tx+"px";
c.tip.style.top=ty+"px";

});


c.canvas.addEventListener("mouseleave",()=>{

c.tip.style.display="none";

});

});


/* ================= ANIMATION ================= */

function animate(now){

if(!running){

lastTime=null;
return;

}

if(lastTime===null){
lastTime=now;
}

const dt=(now-lastTime)/1000;

lastTime=now;

t+=dt;

const T=fallTime();

if(t>=T){

t=T;
running=false;

}

updateValues();
createHistory();
drawScene();
drawCharts();

if(running){
requestAnimationFrame(animate);
}

}


/* ================= BUTTONS ================= */

$("start").addEventListener("click",()=>{

if(t>=fallTime()){
t=0;
}

running=true;
lastTime=null;

requestAnimationFrame(animate);

});


$("pause").addEventListener("click",()=>{

running=false;
lastTime=null;

});


$("reset").addEventListener("click",()=>{

running=false;
lastTime=null;
t=0;
history=[];

parameters();
updateValues();
drawScene();
drawCharts();

});


/* ================= SLIDER ================= */

[h0Slider,gSlider].forEach(slider=>{

slider.addEventListener("input",()=>{

if(!running){

parameters();

t=0;
history=[];

updateValues();
drawScene();
drawCharts();

}

});

});


/* ================= START ================= */

parameters();
updateValues();
resizeAll();

</script>

</body>
</html>
